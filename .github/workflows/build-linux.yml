name: Build Linux packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates python3 python3-venv python3-pip libpython3.10 binutils patchelf squashfs-tools libglib2.0-0 libwayland-client0 libwayland-cursor0 libwayland-egl1 libdrm2 libgbm1 libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1 libdbus-1-3 libfontconfig1 libfreetype6 libnss3 libx11-xcb1 libxrender1 libxi6 libsm6 libice6 fonts-dejavu-core
          python3 -c "from pathlib import Path; import uuid; Path('/etc/machine-id').write_text(uuid.uuid4().hex + '\n')"
          python3 -m venv /opt/build-venv
          /opt/build-venv/bin/pip install -r packaging/requirements-build.txt
      - name: Tests and packages
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          /opt/build-venv/bin/python -m unittest discover -s tests -v
          /opt/build-venv/bin/python tools/build_linux.py
          ./dist/NVIDIA-Commands-for-Linux-2.0.0-x86_64.AppImage --appimage-extract-and-run --self-test
          cd dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: NVIDIA-Commands-for-Linux-Linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS
            dist/build-info.json
  clean-base-check:
    needs: build
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NVIDIA-Commands-for-Linux-Linux
          path: dist
      - name: Verify both formats without system Python or Qt
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          test ! -x /usr/bin/python3
          test ! -e /usr/lib/x86_64-linux-gnu/libQt6Core.so.6
          tr -d '-' < /proc/sys/kernel/random/uuid > /etc/machine-id
          cd dist
          sha256sum -c SHA256SUMS
          chmod +x *.AppImage
          ./NVIDIA-Commands-for-Linux-2.0.0-x86_64.AppImage --appimage-extract-and-run --self-test
          dpkg -i nvidia-commands-for-linux_2.0.0_amd64.deb
          nvidia-commands-for-linux --self-test
          nvidia-commands-for-linux --version
          dpkg --purge nvidia-commands-for-linux
          test ! -e /opt/nvidia-commands-for-linux
          test ! -e /usr/bin/nvidia-commands-for-linux
          test ! -e /usr/share/applications/nvidia-commands-for-linux.desktop
