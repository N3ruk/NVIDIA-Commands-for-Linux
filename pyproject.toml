[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvidia-commands-for-linux"
version = "2.0.0"
description = "NVIDIA graphics launch commands for Steam and Epic on Linux"
requires-python = ">=3.10"

[project.optional-dependencies]
pyside = ["PySide6>=6.6,<7"]
pyqt = ["PyQt6>=6.6,<7"]

[project.scripts]
nvidia-commands-for-linux = "nvidia_commands.ui:main"

[tool.setuptools]
packages = ["nvidia_commands"]

[tool.setuptools.package-data]
nvidia_commands = ["data/*.json", "assets/*.svg", "assets/*.png"]
